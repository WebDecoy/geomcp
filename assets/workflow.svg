<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400"><rect width="1600" height="400" rx="20" fill="#101311"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="65" fill="#d8ff55" font-size="16" letter-spacing="3">A SHORTER PATH FROM QUESTION TO FIX</text><g transform="translate(60 105)"><path d="M0 0H330" stroke="#39452d"/><text x="0" y="42" fill="#829175" font-size="20" font-family="monospace">01</text><text x="0" y="111" fill="#f4f6ee" font-size="47" font-weight="700">ASK</text><text x="0" y="156" fill="#b8c0b3" font-size="20">Audit this landing page.</text></g><g transform="translate(442 105)"><path d="M0 0H330" stroke="#39452d"/><text x="0" y="42" fill="#829175" font-size="20" font-family="monospace">02</text><text x="0" y="111" fill="#f4f6ee" font-size="47" font-weight="700">INSPECT</text><text x="0" y="156" fill="#b8c0b3" font-size="20">HTML, policies, discovery.</text></g><g transform="translate(824 105)"><path d="M0 0H330" stroke="#39452d"/><text x="0" y="42" fill="#829175" font-size="20" font-family="monospace">03</text><text x="0" y="111" fill="#f4f6ee" font-size="47" font-weight="700">IMPROVE</text><text x="0" y="156" fill="#b8c0b3" font-size="20">Fix what the evidence shows.</text></g><g transform="translate(1206 105)"><path d="M0 0H330" stroke="#39452d"/><text x="0" y="42" fill="#829175" font-size="20" font-family="monospace">04</text><text x="0" y="111" fill="#f4f6ee" font-size="47" font-weight="700">VERIFY</text><text x="0" y="156" fill="#b8c0b3" font-size="20">Compare the next audit.</text></g><text x="60" y="345" fill="#829175" font-size="17">Your assistant gets structured evidence. You stay in control of changes.</text></g></svg>